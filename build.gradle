/*
 * OSPulse RuneLite external plugin.
 * Layout mirrors https://github.com/runelite/example-plugin so the Plugin Hub
 * "standard" build can compile it against the pinned RuneLite client.
 *
 * Note on dependencies: gson and okhttp are TRANSITIVE dependencies of
 * net.runelite:client (provided by the RuneLite client at runtime), so they
 * are available on the compile classpath without an explicit declaration and
 * require no dependency-hash verification. okhttp is pinned compileOnly to
 * 3.14.9 to MATCH the version RuneLite ships at runtime (compiling against
 * okhttp 4.x throws NoSuchMethodError at runtime for RequestBody.create).
 */
plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
	compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	// Pinned to the version RuneLite ships at runtime; provided by the client.
	compileOnly 'com.squareup.okhttp3:okhttp:3.14.9'
	compileOnly 'com.google.code.gson:gson:2.8.5'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
	// Client-thread-facing integration classes (e.g. FishBarrelTracker) take a
	// live net.runelite.api.Client, which is impractical to hand-stub (200+
	// methods); Mockito lets tests supply just the handful of behaviours each
	// scenario needs. Test-only: never touches the shipped plugin jar.
	testImplementation 'org.mockito:mockito-core:4.11.0'
	// inline mock-maker: lets tests spy final classes (e.g. SessionEngine) to
	// assert scheduling invariants. Test-only; never touches the shipped jar.
	testImplementation 'org.mockito:mockito-inline:4.11.0'
}

group = 'com.ospulse'
version = '0.2.2'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

// ---------------------------------------------------------------------------
// Dev-build marker. A local sideloaded testing build (./gradlew -Pdev shadowJar)
// names the plugin "OSPulse (dev)" so it is unmistakable next to the live
// Plugin Hub copy in the client's plugin list. The Plugin Hub build runs a
// clean ./gradlew with NO -Pdev, so the shipped plugin stays "OSPulse".
//
// The name is a compile-time constant (BuildInfo.PLUGIN_NAME) so it can be used
// in the @PluginDescriptor annotation. The default is the committed
// src/main/java/com/ospulse/BuildInfo.java ("OSPulse"), which the Plugin Hub
// packager compiles directly — it builds only src/main/java and does NOT run
// custom Gradle tasks, so BuildInfo must be a real committed source file, not
// generated, or the Hub build fails with "cannot find symbol: BuildInfo".
//
// Only the -Pdev build overrides it: it generates a " (dev)"-suffixed BuildInfo
// into a generated source dir and excludes the committed one to avoid a
// duplicate class. This whole block is inert on the Hub build.
def devBuild = project.hasProperty('dev')
if (devBuild) {
	def generatedSrcDir = layout.buildDirectory.dir('generated/sources/buildinfo/java')

	def generateBuildInfo = tasks.register('generateBuildInfo') {
		def outDir = generatedSrcDir
		inputs.property('devBuild', devBuild)
		outputs.dir(outDir)
		doLast {
			def pkgDir = outDir.get().dir('com/ospulse').asFile
			pkgDir.mkdirs()
			new File(pkgDir, 'BuildInfo.java').text = """\
package com.ospulse;

/**
 * Build-time constants, generated by the {@code generateBuildInfo} Gradle task
 * for {@code -Pdev} sideloaded testing builds (overrides the committed default).
 */
public final class BuildInfo
{
\tprivate BuildInfo() {}

\t/** Plugin display name for local -Pdev builds. */
\tpublic static final String PLUGIN_NAME = "OSPulse (dev)";
}
"""
		}
	}

	sourceSets.main.java.srcDir generatedSrcDir
	// Exclude the COMMITTED BuildInfo.java (under src/main/java) so the generated
	// " (dev)" copy wins without a duplicate-class error. Match by absolute path
	// so the exclude hits only the committed file, not the generated override
	// (both share the relative path com/ospulse/BuildInfo.java).
	sourceSets.main.java.exclude { element ->
		element.file.absolutePath.replace(File.separatorChar, '/' as char)
			.endsWith('src/main/java/com/ospulse/BuildInfo.java')
	}
	tasks.named('compileJava') { dependsOn generateBuildInfo }
}

// ---------------------------------------------------------------------------
// Plugin Hub review-bot token budget guard.
//
// The Hub's automated reviewer refuses plugins whose source exceeds a 200,000
// LLM-token budget (maintainer ruling on runelite/plugin-hub#13797, 2026-07-27).
// Only src/main/java counts — resources and tests are excluded — and comments
// are stripped before counting. Exceeding it silently blocks ALL future plugin
// updates, and the only feedback is a maintainer comment days or weeks later,
// so this fails the build locally instead.
//
// Counting method: comments are stripped string-literal-aware (so a "//" inside
// a string is not mistaken for a comment), blank lines are dropped, and trailing
// whitespace is trimmed. The resulting character count is converted with
// CHARS_PER_TOKEN, calibrated by tokenising the real stripped tree with
// tiktoken o200k_base: 793,906 chars -> 200,136 tokens = 3.967 chars/token.
// This is an approximation of a bot whose exact tokeniser is unpublished, hence
// the deliberate margin between the default max and the true 200,000 ceiling.
//
// The Hub packager compiles src/main/java directly and does not run custom
// Gradle tasks (see the BuildInfo note above), so this task is inert there and
// cannot break the published build.
//
// Overrides: -PtokenBudgetMax=N / -PtokenBudgetWarn=N
// Thresholds. The true Hub ceiling is 200,000; these sit below it so a breach is
// caught while there is still room to react, not after the Hub has refused the
// update. Raised 2026-08-27 (MIS-620): warn leaves 1,500 tokens of quiet
// headroom, fail leaves 1,500 below the ceiling to absorb the difference
// between this approximation and the bot's real count. That gap-vs-bot figure
// has never been measured directly; 1,500 is a calculated bet, not a proven
// margin.
def tokenBudgetMax = (project.findProperty('tokenBudgetMax') ?: '198500') as int
def tokenBudgetWarn = (project.findProperty('tokenBudgetWarn') ?: '197000') as int
def tokenBudgetSrc = file('src/main/java')

def tokenBudgetTask = tasks.register('tokenBudget') {
	group = 'verification'
	description = 'Fails if src/main/java exceeds the Plugin Hub review-bot token budget.'
	inputs.dir(tokenBudgetSrc)
	outputs.upToDateWhen { false }

	doLast {
		// String-literal-aware comment stripper: mirrors what the review bot
		// discards, without tripping over "//" or "/*" inside a string or char.
		def stripComments = { String s ->
			def out = new StringBuilder(s.length())
			int i = 0
			int n = s.length()
			while (i < n) {
				char c = s.charAt(i)
				if (c == '"' as char || c == '\'' as char) {
					char quote = c
					int j = i + 1
					while (j < n) {
						char d = s.charAt(j)
						if (d == '\\' as char) {
							j += 2
							continue
						}
						if (d == quote) {
							j++
							break
						}
						j++
					}
					out.append(s, i, Math.min(j, n))
					i = j
					continue
				}
				if (c == '/' as char && i + 1 < n) {
					char next = s.charAt(i + 1)
					if (next == '/' as char) {
						int j = s.indexOf('\n', i)
						i = (j < 0) ? n : j
						continue
					}
					if (next == '*' as char) {
						int j = s.indexOf('*/', i + 2)
						i = (j < 0) ? n : j + 2
						continue
					}
				}
				out.append(c)
				i++
			}
			return out.toString()
		}

		final double CHARS_PER_TOKEN = 3.967
		def perFile = [:]
		long totalChars = 0

		fileTree(tokenBudgetSrc) { include '**/*.java' }.each { f ->
			def stripped = stripComments(f.getText('UTF-8'))
			long chars = 0
			stripped.eachLine { line ->
				def trimmed = line.replaceAll(/\s+$/, '')
				if (trimmed.trim()) {
					chars += trimmed.length() + 1
				}
			}
			totalChars += chars
			perFile[tokenBudgetSrc.toPath().relativize(f.toPath()).toString()] = chars
		}

		int estTokens = Math.round((totalChars / CHARS_PER_TOKEN) as float)
		def pct = (estTokens * 100.0d / tokenBudgetMax).round(1)

		logger.lifecycle("Plugin Hub token budget: ~${String.format('%,d', estTokens)} tokens " +
			"(${pct}% of the ${String.format('%,d', tokenBudgetMax)} guard limit; true Hub ceiling 200,000)")

		if (estTokens > tokenBudgetWarn) {
			logger.lifecycle('Largest contributors:')
			perFile.sort { -it.value }.take(10).each { path, chars ->
				int t = Math.round((chars / CHARS_PER_TOKEN) as float)
				logger.lifecycle(String.format('  %,8d tokens  %4.1f%%  %s',
					t, t * 100.0d / estTokens, path))
			}
		}

		if (estTokens > tokenBudgetMax) {
			throw new GradleException(
				"src/main/java is ~${String.format('%,d', estTokens)} tokens, over the " +
				"${String.format('%,d', tokenBudgetMax)} guard limit (true Hub ceiling 200,000).\n" +
				'The Plugin Hub review bot will refuse this plugin, blocking all future updates.\n' +
				'Reduce source under src/main/java. NOTE: splitting a file into several files does\n' +
				'NOT help — the whole tree is counted. Only deletion, deduplication, or moving data\n' +
				'literals into src/main/resources (which is not counted) reduces the number.')
		}
		else if (estTokens > tokenBudgetWarn) {
			logger.warn("WARNING: within ${String.format('%,d', tokenBudgetMax - estTokens)} tokens " +
				'of the Plugin Hub guard limit.')
		}
	}
}

tasks.named('check') { dependsOn tokenBudgetTask }

tasks.register('shadowJar', Jar) {
	from sourceSets.main.output
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
